name: update-threat-feed

# Runs on a schedule and writes public/attacks.json back to the repo.
# It needs exactly ONE permission: write access to THIS repo's contents (to save the JSON).
# No secrets are used or required.

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay a few min; that's fine)
  workflow_dispatch: {}

permissions:
  contents: write             # the ONLY permission granted

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build feed
        run: python scripts/build_feed.py
      - name: Commit if changed
        run: |
          git config user.name  "threat-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/attacks.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "update threat feed [skip ci]"
          # GitHub sometimes rejects the push with a 500. Retry before failing the run.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push failed (attempt $i), retrying in 20s"
            sleep 20
          done
          echo "push failed after 5 attempts"
          exit 1
